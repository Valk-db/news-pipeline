[project]
name = "news-pipeline"
version = "0.1.0"
description = "Daily news ingestion, verification, and curation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "feedparser>=6.0",
    "asyncpraw>=8.0",
    "trafilatura>=1.6",
    "httpx>=0.27",
    "datasketch>=1.6",
    "spacy>=3.7",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "sentence-transformers>=3.0",
    "tenacity>=8.2",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "groq>=0.5",
    "cerebras-cloud-sdk>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.vercel]
entrypoint = "curation_ui.main:app"