[package]
name = "pipeline-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.26", features = ["ini"] }
dotenvy = "0.15.7"
feed-rs = "2.4.0"
futures = "0.3.34"
getrandom = { version = "0.4.3", features = ["std"] }
hex = "0.4.3"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "uuid", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
