name: CI Rust

on:
  push:
    branches: [rust-port]
  pull_request:
    branches: [rust-port]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
            Cargo.lock
            ~/.cache/.rustbert
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_news -f pipeline-rs/sql/schema.sql
        env:
          PGPASSWORD: postgres

      - name: Run cargo check
        run: cargo check
        working-directory: pipeline-rs

      - name: Run cargo test
        run: timeout 180 cargo test
        working-directory: pipeline-rs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_news

      - name: Run pipeline (dry run)
        run: cargo run -- --help || true
        working-directory: pipeline-rs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_news
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          REDDIT_USER_AGENT: "news-pipeline/0.1 (CI test)"

      - name: Run full pipeline (tier-1 only)
        run: timeout 180 cargo run 2>&1 || true
        working-directory: pipeline-rs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_news
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          REDDIT_USER_AGENT: "news-pipeline/0.1 (CI test)"