name: Weekly Story Cleanup

on:
  schedule:
    # Run weekly on Sunday at 03:23 UTC (off-peak minute to avoid cron delay)
    - cron: '23 3 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Need write for heartbeat commit

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Run cleanup job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run scripts/cleanup_stale.py --pending-hours=120 --blocked-hours=168 --queued-hours=0

      - name: Heartbeat commit (keeps scheduled workflow alive)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || (git rebase --abort || true)
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run
          git add .github/last-run
          git diff --staged --quiet || git commit -m "chore: heartbeat"
          for i in {1..3}; do git push && break || sleep 2; done