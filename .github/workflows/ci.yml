name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Fails if pyproject.toml and uv.lock disagree. Production workflows install with
      # --frozen (they trust the lockfile), so a stale lock must never reach main.
      - name: Check lockfile is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra pipeline

      - name: Run ruff
        run: uv run ruff check .

      # Ratchet, not a soft gate. `continue-on-error: true` with nothing comparing
      # counts is a no-op that prints a wall of pre-existing errors and moves on;
      # there is no code anywhere that compares error counts. ci/gates.py fails
      # when the count RISES above the floor and passes when it falls. The floor
      # lives in ci/baseline.json, was measured on main (not on a branch), and a
      # run whose output cannot be parsed is a FAILURE, never an implicit pass.
      - name: Ratchet mypy error count
        run: uv run python -m ci.gates mypy

      # Floor on collected tests so a test cannot silently disappear. Both floors
      # and their provenance live in the same committed file.
      - name: Check collected test count
        run: uv run python -m ci.gates tests

      # Free, offline, no account, no token, no Docker: Yelp's detect-secrets,
      # installed by the dev extra. Everything else needs a binary this job
      # cannot fetch or pin.
      #
      # The scan is diffed against a slim baseline of the 17 known non-secrets
      # in this tree, all reviewed by hand: placeholder DSNs (user:pass in
      # .env.example and VERCEL_DEPLOY.md, app-user:pw and gsk_super_secret in
      # the tests), the ephemeral postgres:postgres of this job's own service
      # container, env(VAR) references in supabase/config.toml, and the two CDN
      # subresource-integrity digests in map.html. Anything new fails the build
      # and the diff names it. `--slim` drops generated_at, which is what makes
      # the baseline byte-stable enough to diff; the cost is that it cannot be
      # re-audited with `detect-secrets audit`, which is cheap to redo by hand
      # at 17 lines.
      #
      # HexHighEntropyString is off and everything else stays on. This repo is
      # legitimately full of high-entropy hex (content_hash, url_hash, MinHash
      # permutations), and that one detector reported 1,169 findings, 1,160 of
      # them in eval/data. A baseline that noisy is not a gate.
      - name: Scan for secrets
        run: |
          uv run detect-secrets scan --slim \
            --disable-plugin HexHighEntropyString \
            --exclude-files '^\.secrets\.baseline$' > /tmp/secrets-current.json
          diff -u .secrets.baseline /tmp/secrets-current.json

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra pipeline

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Apply migrations
        run: uv run python -m scripts.migrate
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_news

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_news

      # A green suite does not mean the suite is intact: deleting a failing
      # test makes it green. This counts what was collected and compares it to
      # the floor in ci_quality_floor.json (1816, measured on main c58c6f6).
      # Collected, not passed -- passes, skips and failures are all visible in
      # the run above, but a deleted test only ever shows up as a smaller
      # collection, so this is a separate invocation rather than a hook.
      - name: Check the test-count floor
        run: |
          uv run pytest tests/ --collect-only -q > /tmp/collected.txt 2>&1 || true
          tail -3 /tmp/collected.txt
          uv run python -m scripts.ci_quality_gate pytest /tmp/collected.txt
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_news
