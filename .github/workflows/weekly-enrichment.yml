name: Weekly Enrichment & Reliability

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: weekly-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run enrichment pipeline
        id: enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.run_weekly_enrichment

      - name: Check for zero enrichment results
        if: always()
        run: |
          SUMMARY='${{ steps.enrichment.outputs.ENRICHMENT_SUMMARY }}'

          if [[ "$SUMMARY" != "" ]]; then
            STORIES=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('stories_processed', 0))")
            MEDIA=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('total_media_assets', 0))")
            EMBEDDINGS=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('total_embeddings_generated', 0))")

            if [[ "$STORIES" -gt 0 ]] && [[ "$MEDIA" -eq 0 ]] && [[ "$EMBEDDINGS" -eq 0 ]]; then
              echo "::warning title=Zero enrichment output::Enrichment processed $STORIES stories but produced 0 media assets and 0 embeddings. This indicates a silent failure in the enrichment pipeline."
            fi
          fi

  # Phase 2: Claim extraction, topic assignment, narrative arcs
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Seed topic groups (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.seed_topic_groups

      - name: Assign topic groups to recent QUEUED stories
        id: topic_assignment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -c "
          import asyncio
          from src.shared.database import init_db, get_session_maker
          from src.verification.topics import assign_topic_groups_for_recent_stories

          async def main():
              await init_db()
              session_factory = get_session_maker()
              results = await assign_topic_groups_for_recent_stories(session_factory, hours_back=168, max_stories=100)
              print(f'Assigned topic groups to {len(results)} stories')
              for r in results:
                  if r.get('created'):
                      print(f'  {r[\"story_id\"]}: {r[\"topic_group\"]} (conf={r[\"confidence\"]})')

          asyncio.run(main())
          "

      - name: Extract claims for recent QUEUED stories
        id: claim_extraction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.run_claim_extraction

      - name: Link narrative arcs for recent QUEUED stories
        id: narrative_arcs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -c "
          import asyncio
          from src.shared.database import init_db, get_session_maker
          from src.verification.narrative import link_narrative_arcs_for_recent_stories

          async def main():
              await init_db()
              session_factory = get_session_maker()
              results = await link_narrative_arcs_for_recent_stories(session_factory, hours_back=168, max_stories=100)
              print(f'Linked narrative arcs for {len(results)} stories')
              created = [r for r in results if r.get(\"created\")]
              print(f'  Created {len(created)} new edges')
              for r in created:
                  print(f'  {r[\"subject_id\"]} -> {r[\"object_id\"]} ({r[\"predicate\"]}, conf={r[\"confidence\"]})')

          asyncio.run(main())
          "

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run reliability snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.run_weekly_reliability

  globe-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run globe events backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m scripts.backfill_globe_events