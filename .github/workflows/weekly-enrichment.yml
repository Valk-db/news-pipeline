name: Weekly Enrichment & Reliability

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: weekly-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run enrichment pipeline
        id: enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.run_weekly_enrichment

      - name: Check for zero enrichment results
        if: always()
        run: |
          SUMMARY='${{ steps.enrichment.outputs.ENRICHMENT_SUMMARY }}'

          if [[ "$SUMMARY" != "" ]]; then
            STORIES=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('stories_processed', 0))")
            MEDIA=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('total_media_assets', 0))")
            EMBEDDINGS=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('total_embeddings_generated', 0))")

            if [[ "$STORIES" -gt 0 ]] && [[ "$MEDIA" -eq 0 ]] && [[ "$EMBEDDINGS" -eq 0 ]]; then
              echo "::warning title=Zero enrichment output::Enrichment processed $STORIES stories but produced 0 media assets and 0 embeddings. This indicates a silent failure in the enrichment pipeline."
            fi
          fi

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run reliability snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.run_weekly_reliability

  globe-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run globe events backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m scripts.backfill_globe_events