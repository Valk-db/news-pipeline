name: Weekly Enrichment & Reliability

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: weekly-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run enrichment pipeline
        id: enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -c "
import asyncio
import json
from src.shared.database import init_db, get_session
from src.enrichment.pipeline import enrich_recent_stories

async def main():
    await init_db()
    async with get_session() as session:
        results = await enrich_recent_stories(session, hours_back=168, max_stories=100)
        print(f'Enriched {len(results)} stories')
        total_media = 0
        total_videos = 0
        total_social = 0
        total_embeddings = 0
        for r in results:
            if r.get('errors'):
                print(f'  Story {r[\"story_id\"]}: {len(r[\"errors\"])} errors')
            else:
                print(f'  Story {r[\"story_id\"]}: media={r[\"media_assets\"]} videos={r[\"videos_found\"]} snippets={r[\"social_snippets_found\"]} embeddings={r[\"embeddings_generated\"]}')
                total_media += r.get('media_assets', 0)
                total_videos += r.get('videos_found', 0)
                total_social += r.get('social_snippets_found', 0)
                total_embeddings += r.get('embeddings_generated', 0)
        # Output for GitHub Actions
        summary = {
            'stories_processed': len(results),
            'total_media_assets': total_media,
            'total_videos_found': total_videos,
            'total_social_snippets': total_social,
            'total_embeddings_generated': total_embeddings
        }
        print(f'ENRICHMENT_SUMMARY={json.dumps(summary)}')

asyncio.run(main())
"

      - name: Check for zero enrichment results
        if: always()
        run: |
          # Extract the ENRICHMENT_SUMMARY from the previous step's output
          # Note: In GitHub Actions, we need to capture the output differently
          # For now, we'll check the step output directly
          if [[ "${{ steps.enrichment.outputs.ENRICHMENT_SUMMARY }}" != "" ]]; then
            SUMMARY='${{ steps.enrichment.outputs.ENRICHMENT_SUMMARY }}'
          else
            # Parse from logs - this is a fallback
            SUMMARY=$(grep 'ENRICHMENT_SUMMARY=' | head -1 | cut -d'=' -f2-)
          fi

          if [[ "$SUMMARY" != "" ]]; then
            STORIES=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('stories_processed', 0))")
            MEDIA=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('total_media_assets', 0))")
            EMBEDDINGS=$(echo "$SUMMARY" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('total_embeddings_generated', 0))")

            if [[ "$STORIES" -gt 0 ]] && [[ "$MEDIA" -eq 0 ]] && [[ "$EMBEDDINGS" -eq 0 ]]; then
              echo "::warning title=Zero enrichment output::Enrichment processed $STORIES stories but produced 0 media assets and 0 embeddings. This indicates a silent failure in the enrichment pipeline."
            fi
          fi

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run reliability snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -c "
import asyncio
from datetime import datetime, timezone
from src.shared.database import init_db, get_session
from src.reliability.consensus_analyzer import compute_daily_reliability_snapshots

async def main():
    await init_db()
    async with get_session() as session:
        # Compute for yesterday
        yesterday = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
        count = await compute_daily_reliability_snapshots(session, yesterday)
        print(f'Created {count} reliability snapshots')

asyncio.run(main())
"

  globe-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: enrichment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run globe events backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python scripts/backfill_globe_events.py