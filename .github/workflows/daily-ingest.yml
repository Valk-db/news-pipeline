name: Daily News Ingestion

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Need write for heartbeat commit

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run ingestion pipeline
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
          GDELT_ENABLED: "false"
          CURATION_ENABLED: "false"
        run: |
          uv run python -m src.ingestion.run

      - name: Heartbeat commit (keeps scheduled workflow alive)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run
          git add .github/last-run
          git diff --staged --quiet || git commit -m "chore: heartbeat"
          git push