name: Daily News Ingestion

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit status log

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Need history for commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run ingestion pipeline
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "10"
        run: |
          uv run src/ingestion/run.py

      - name: Run verification pipeline
        if: steps.ingest.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          uv run python -c "
import asyncio
from src.verification.units import build_reporting_units
from src.verification.stories import build_stories
from src.verification.tiers import apply_tier1_gate
from src.shared.database import get_session

async def main():
    async with get_session() as session:
        print('Building reporting units...')
        await build_reporting_units(session)
        print('Building stories...')
        await build_stories(session)
        print('Applying tier-1 gate...')
        await apply_tier1_gate(session)
        print('Verification complete!')

asyncio.run(main())
"

      - name: Generate status log
        if: always()
        id: status_log
        run: |
          mkdir -p logs
          # Create a compact status summary for the commit
          cat > logs/status_$(date -u +%Y-%m-%d_%H-%M).json << EOF
          {
            "run_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "status": "${{ job.status }}",
            "ingest_outcome": "${{ steps.ingest.outcome }}",
            "verification_outcome": "${{ steps.verification.outcome }}"
          }
          EOF

      - name: Truncate old status logs (keep 30 days)
        if: always()
        run: |
          find logs -name "status_*.json" -mtime +30 -delete

      - name: Commit status log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "chore: status log $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed. Check workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1