name: Daily News Ingestion

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read  # Only need read for checkout

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run ingestion pipeline
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "10"
        run: |
          uv run src/ingestion/run.py

      - name: Run verification pipeline
        if: steps.ingest.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          uv run python -c "
import asyncio
from src.verification.units import build_reporting_units
from src.verification.stories import build_stories
from src.verification.tiers import apply_tier1_gate
from src.shared.database import init_db, get_session

async def main():
    await init_db()
    async with get_session() as session:
        await build_reporting_units(session)
        modified_stories = await build_stories(session)
        if modified_stories:
            await apply_tier1_gate(session, story_ids=modified_stories)

asyncio.run(main())
"