name: Daily News Ingestion

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write  # Need write for heartbeat commit

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Smoke test Reddit RSS accessibility
        continue-on-error: true
        run: |
          set -euo pipefail
          # Test one subreddit feed to catch IP blocks / 429s early.
          # Non-fatal: Reddit is a tier-3 source that already degrades
          # gracefully per-entry in ingest_reddit(); RSS (tier-1) and GDELT
          # must not be held hostage to a blocked/flaky Reddit feed.
          test_url="https://www.reddit.com/r/worldnews/top.rss?t=day&limit=1"
          echo "Testing Reddit RSS: $test_url"
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: news-pipeline/0.1 (by /u/valk_db)" "$test_url" --max-time 15)
          if [[ "$status" != "200" ]]; then
            echo "::warning title=Reddit smoke test failed::Reddit RSS returned HTTP $status — feed may be blocked from this runner. Continuing: Reddit is tier-3 and degrades gracefully, RSS/GDELT are unaffected."
            exit 1
          fi
          echo "✅ Reddit RSS accessible (HTTP 200)"

      - name: Schema drift check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
          GDELT_ENABLED: "false"
        run: |
          uv run python -m scripts.check_schema

      - name: Run ingestion pipeline
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
          GDELT_ENABLED: "false"
        run: |
          uv run python -m src.ingestion.run

      - name: Heartbeat commit (keeps scheduled workflow alive)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run
          git add .github/last-run
          git diff --staged --quiet || git commit -m "chore: heartbeat"
          git push