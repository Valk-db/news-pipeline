name: Daily News Ingestion

on:
  schedule:
    # Run twice daily at 06:23 and 18:23 UTC (off-peak minute to avoid cron delay)
    - cron: '23 6,18 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      target_db:
        description: 'Database to run against (scheduled runs always use prod)'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write  # Need write for heartbeat commit

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Schema drift check (preflight, fails the run before it starts)
        env:
          DATABASE_URL: ${{ inputs.target_db == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m scripts.check_schema

      - name: LLM preflight (fail fast on auth errors)
        env:
          DATABASE_URL: ${{ inputs.target_db == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -c "
          import asyncio
          from src.shared.llm_preflight import run_llm_preflight_or_fail
          asyncio.run(run_llm_preflight_or_fail())
          "

      - name: Run ingestion pipeline
        id: ingest
        env:
          DATABASE_URL: ${{ inputs.target_db == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
          GDELT_ENABLED: "false"
          # Dev runs crawl through the egress proxy, so they use a wider fetch
          # semaphore and a shorter per-feed timeout. Scheduled and prod runs
          # keep the production defaults (10 / 30s) spelled out here so a dev
          # value can never leak into production.
          RSS_FETCH_CONCURRENCY: ${{ inputs.target_db == 'dev' && '25' || '10' }}
          RSS_FETCH_TIMEOUT: ${{ inputs.target_db == 'dev' && '15' || '30' }}
        run: |
          uv run python -m src.ingestion.run

      - name: Check tier-1 freshness (fail if no tier-1 articles in 30h)
        if: always()
        env:
          DATABASE_URL: ${{ inputs.target_db == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          uv run python scripts/check_freshness.py --hours 30

      - name: Report pipeline orphans (fail if the report is incomplete)
        if: always()
        env:
          DATABASE_URL: ${{ inputs.target_db == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          uv run python scripts/check_orphans.py

      - name: Heartbeat commit (keeps scheduled workflow alive)
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || (git rebase --abort || true)
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run
          git add .github/last-run
          git diff --staged --quiet || git commit -m "chore: heartbeat"
          for i in {1..3}; do git push && break || sleep 2; done