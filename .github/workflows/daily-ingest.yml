name: Daily News Ingestion

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write  # Need write for heartbeat commit

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Schema drift check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
          GDELT_ENABLED: "false"
        run: |
          uv run python -m scripts.check_schema

      - name: Run ingestion pipeline
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDELT_THROTTLE_SECONDS: "30"
          PYTHONUNBUFFERED: "1"
          GDELT_ENABLED: "false"
        run: |
          uv run python -m src.ingestion.run

      - name: Check tier-1 freshness (fail if no tier-1 articles in 30h)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python scripts/check_freshness.py --hours 30

      - name: Heartbeat commit (keeps scheduled workflow alive)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run
          git add .github/last-run
          git diff --staged --quiet || git commit -m "chore: heartbeat"
          for i in {1..3}; do git push && break || sleep 2; done