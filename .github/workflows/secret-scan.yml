name: secret-scan

# Free, no account, no API key, no paid tier: gitleaks' CLI is MIT-licensed and
# the vendor's hosted action is not usable here (action v2 requires a paid
# licence key for any repository owned by a GitHub Organization, which is an
# account this batch is not allowed to create).
#
# This is a SEPARATE workflow from ci.yml on purpose. ci.yml runs only on pushes
# to main and PRs against main, so a secret committed on a feature branch would
# not be scanned until the branch was merged. This one runs on every push to
# every branch and needs no dependency install, no Python and no database, so it
# costs seconds where ci.yml costs minutes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # One place to bump, and the sha256 is pinned with it: an unpinned or
      # unverified download is how a supply-chain hole gets into CI. Both values
      # come from the vendor's published
      # gitleaks_8.30.1_checksums.txt for release v8.30.1.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the second scan below walks every commit: a
          # secret that was committed and then deleted is still a leaked secret,
          # and a shallow clone cannot see it.
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks version

      - name: Scan the committed tree
        # Catches a secret in the tree at the pushed commit. This is the scan
        # that fails on a pull request which would leak a key.
        run: ./gitleaks dir --redact --no-banner --config .gitleaks.toml .

      - name: Scan full git history
        # Catches a secret that was committed and later removed, which the tree
        # scan cannot see. Verified clean on this repository at the time of
        # writing: 449 commits, 0 findings.
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .