[project]
name = "curation-ui"
version = "0.1.0"
description = "News Pipeline Curation UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "groq>=0.5",
    "cerebras-cloud-sdk>=0.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-multipart>=0.0.6",
]

[tool.vercel]
entrypoint = "main:app"