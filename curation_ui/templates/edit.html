<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Story - News Pipeline</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="/static/errors.js" defer></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container edit-page">
        <header>
            <h1>Edit Story</h1>
            <div class="header-actions">
                <a href="/" class="btn btn-secondary">← Back</a>
                <button class="btn btn-ghost btn-sm" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme (T)">
                    <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <form hx-post="/story/{{ story.id }}/save" hx-target="body" hx-swap="outerHTML">
            <input type="hidden" name="platform" value="twitter">

            <div class="form-group">
                <label>Platform</label>
                <select name="platform" id="platform">
                    <option value="twitter" selected>Twitter/X</option>
                    <option value="instagram">Instagram</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="threads">Threads</option>
                    <option value="bluesky">Bluesky</option>
                </select>
            </div>

            <div class="form-group">
                <label>Caption <span class="char-count">(<span id="char-count">0</span>/280)</span></label>
                <textarea name="caption" id="caption" rows="6" required>{{ draft_caption }}</textarea>
                <div class="caption-hint">
                    Paraphrase only. One source link. No verbatim article text.
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="override_validation" value="true">
                    <span>Override validation (allow potential paraphrase issues)</span>
                </label>
                <div class="caption-hint">
                    Check this to save despite n-gram overlap warnings. Use sparingly.
                </div>
            </div>

            <div class="form-group">
                <label>Source URLs (for attribution)</label>
                <div class="source-urls">
                    {% for url in source_urls %}
                    <div class="source-url">{{ url }}</div>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label>Key Facts</label>
                <div class="key-facts">
                    {% for fact in key_facts %}
                    <div class="fact-item">{{ fact }}</div>
                    {% endfor %}
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">Save & Queue</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>

    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('theme-icon-sun');
        const moonIcon = document.getElementById('theme-icon-moon');
        const html = document.documentElement;

        function updateThemeIcon(theme) {
            if (theme === 'light') {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }

        function getInitialTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
        }

        const initialTheme = getInitialTheme();
        applyTheme(initialTheme);

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
            if (e.key.toLowerCase() === 't') {
                e.preventDefault();
                themeToggle.click();
            }
        });

        const caption = document.getElementById('caption');
        const charCount = document.getElementById('char-count');
        const platform = document.getElementById('platform');

        const limits = { twitter: 280, instagram: 2200, linkedin: 3000, threads: 500, bluesky: 300 };

        function updateCount() {
            const limit = limits[platform.value] || 280;
            charCount.textContent = caption.value.length;
            charCount.className = caption.value.length > limit ? 'error' : (caption.value.length > limit * 0.85 ? 'warning' : '');
        }

        caption.addEventListener('input', updateCount);
        platform.addEventListener('change', updateCount);
        updateCount();
    </script>
</body>
</html>
