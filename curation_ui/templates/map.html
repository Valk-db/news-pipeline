<!DOCTYPE html>
<html lang="en" data-theme="map">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>News Pipeline - Flat Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/map/map.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="/static/map/map.js" defer></script>
</head>
<body>
    <div class="map-shell">
        <header class="map-header">
            <div class="header-brand">
                <span class="map-brand-mark" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="1 6 1 18 8 21 16 18 23 21 23 9 16 6 8 9 1 6"></polygon>
                        <line x1="8" y1="9" x2="8" y2="21"></line>
                        <line x1="16" y1="6" x2="16" y2="18"></line>
                    </svg>
                </span>
                <div class="map-brand-text">
                    <h1>Event Map</h1>
                    <span class="map-brand-subtitle">Flat Map — Global Intelligence</span>
                </div>
            </div>

            <div class="map-header-controls">
                <div class="map-field">
                    <span class="map-field-label" id="map-mode-label">Mode</span>
                    <div class="map-mode-toggle" role="group" aria-labelledby="map-mode-label">
                        <button type="button" class="map-mode-btn is-active" id="map-mode-live"
                                data-mode="live" aria-pressed="true">Live</button>
                        <button type="button" class="map-mode-btn" id="map-mode-replay"
                                data-mode="replay" aria-pressed="false">Replay</button>
                    </div>
                </div>

                <div class="map-field">
                    <label for="event-type-select">Event Type</label>
                    <select id="event-type-select" class="map-select" aria-label="Filter by event type">
                        <option value="">All types</option>
                        <!-- Populated from the EventType vocabulary in map.js -->
                    </select>
                </div>

                <div class="map-status" id="map-status" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span class="status-text" id="map-status-text">loading…</span>
                </div>

                <a href="/globe" class="map-btn" title="Open the 3D globe view">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span class="map-btn-label">Globe</span>
                </a>

                <a href="/" class="map-btn" title="Return to Curation">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span class="map-btn-label">Curation</span>
                </a>
            </div>
        </header>

        <div class="map-body" id="map-body">
            <div id="map" role="application" aria-label="World map of news events"></div>

            <div class="map-banner" id="map-banner" role="alert" hidden>
                <span class="map-banner-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </span>
                <div class="map-banner-text">
                    <span class="map-banner-title">Data unavailable</span>
                    <span class="map-banner-message" id="map-banner-message"></span>
                </div>
                <button type="button" class="map-banner-close" id="map-banner-close" aria-label="Dismiss">&times;</button>
            </div>

            <section class="map-legend" id="map-legend" aria-label="Event type legend">
                <button type="button" class="map-legend-head" id="map-legend-head" aria-expanded="true" aria-controls="map-legend-list">
                    <span>Event Types</span>
                    <span class="map-legend-caret" aria-hidden="true">▼</span>
                </button>
                <div class="map-legend-body">
                    <ul class="map-legend-list" id="map-legend-list">
                        <!-- Populated from the EventType vocabulary in map.js -->
                    </ul>
                    <p class="map-legend-hint">Marker size reflects confidence. Tap a marker for details.</p>
                </div>
            </section>

            <!-- Replay mode scrubber: hidden while the live mode toggle is active. -->
            <section class="map-replay" id="map-replay" aria-label="Replay time scrubber" hidden>
                <div class="map-replay-bar">
                    <button type="button" class="map-replay-play" id="map-replay-play"
                            aria-label="Play replay" aria-pressed="false">
                        <svg class="map-replay-icon map-replay-icon-play" width="16" height="16"
                             viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <polygon points="6 3 21 12 6 21 6 3"></polygon>
                        </svg>
                        <svg class="map-replay-icon map-replay-icon-pause" width="16" height="16"
                             viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <rect x="5" y="3" width="5" height="18"></rect>
                            <rect x="14" y="3" width="5" height="18"></rect>
                        </svg>
                    </button>

                    <div class="map-replay-readout">
                        <span class="map-replay-clock" id="map-replay-clock">—</span>
                        <span class="map-replay-progress" id="map-replay-progress">0 / 0 events</span>
                    </div>

                    <div class="map-replay-field">
                        <label for="map-replay-window">Window</label>
                        <select id="map-replay-window" class="map-select map-select-sm">
                            <option value="24h">Last 24h</option>
                            <option value="7d" selected>Last 7d</option>
                            <option value="30d">Last 30d</option>
                            <option value="all">All time</option>
                        </select>
                    </div>

                    <div class="map-replay-field">
                        <label for="map-replay-speed">Speed</label>
                        <select id="map-replay-speed" class="map-select map-select-sm">
                            <option value="0.5">0.5&times;</option>
                            <option value="1" selected>1&times;</option>
                            <option value="2">2&times;</option>
                            <option value="4">4&times;</option>
                            <option value="8">8&times;</option>
                            <option value="16">16&times;</option>
                        </select>
                    </div>
                </div>

                <input type="range" class="map-replay-scrub" id="map-replay-scrub"
                       min="0" max="1000" step="1" value="0"
                       aria-label="Scrub replay time" disabled>

                <div class="map-replay-scale">
                    <span class="map-replay-bound" id="map-replay-start">—</span>
                    <span class="map-replay-bound" id="map-replay-end">—</span>
                </div>

                <p class="map-replay-note" id="map-replay-note" hidden></p>
            </section>
        </div>
    </div>
</body>
</html>
