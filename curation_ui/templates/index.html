<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Pipeline - Curation</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="/static/errors.js" defer></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>News Pipeline Curation</h1>
            <div class="header-actions">
                <a href="/posts" class="btn btn-secondary">View Posts ({{ posts_count }})</a>
                <button class="btn btn-ghost btn-sm" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme (T)">
                    <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <span class="keyboard-hint">Keys: A=Approve, R=Reject, E=Edit, T=Theme</span>
            </div>
        </header>

        {% include "story_grid.html" %}
    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('theme-icon-sun');
        const moonIcon = document.getElementById('theme-icon-moon');
        const html = document.documentElement;

        function updateThemeIcon(theme) {
            if (theme === 'light') {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }

        // Check for saved theme or system preference
        function getInitialTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        // Apply theme
        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
        }

        // Initialize
        const initialTheme = getInitialTheme();
        applyTheme(initialTheme);

        // Toggle handler
        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        });

        // Keyboard shortcut for theme toggle (T)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
            if (e.key.toLowerCase() === 't') {
                e.preventDefault();
                themeToggle.click();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

            const key = e.key.toLowerCase();
            const focused = document.querySelector('.story-card:focus-within') ||
                           document.querySelector('.story-card:hover') ||
                           document.querySelector('.story-card');

            if (!focused) return;

            const storyId = focused.dataset.storyId;
            if (!storyId) return;

            if (key === 'a') {
                e.preventDefault();
                htmx.ajax('POST', `/story/${storyId}/approve`, { target: '#stories', swap: 'outerHTML' });
            } else if (key === 'r') {
                e.preventDefault();
                htmx.ajax('POST', `/story/${storyId}/reject`, { target: '#stories', swap: 'outerHTML' });
            } else if (key === 'e') {
                e.preventDefault();
                window.location.href = `/story/${storyId}/edit`;
            }
        });

        // Focus first card on load
        document.addEventListener('DOMContentLoaded', () => {
            const firstCard = document.querySelector('.story-card');
            if (firstCard) firstCard.focus();
        });
    </script>
</body>
</html>
