<!DOCTYPE html>
<html lang="en" data-theme="globe">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Pipeline - Live Globe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="/static/errors.js" defer></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/globe/globe.css">
    <!-- CesiumJS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
    <!-- Scanline overlay for instrument feel -->
    <div class="scanline-overlay" aria-hidden="true"></div>

    <div class="globe-container">
        <header class="globe-header">
            <div class="header-brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>Live Event Globe</h1>
                    <span class="brand-subtitle">Mission Control — Global Intelligence</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="live-status" id="live-status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span class="status-text">LIVE</span>
                    <span class="status-latency" id="status-latency">—</span>
                </div>
                <a href="/" class="btn btn-secondary btn-sm" title="Return to Curation (Esc)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Curation</span>
                </a>
            </div>
        </header>

        <div class="globe-layout">
            <!-- Left Panel: Controls & Filters -->
            <aside class="globe-sidebar" id="globe-sidebar">
                <div class="sidebar-section">
                    <h3>Time Range</h3>
                    <div class="time-controls">
                        <label>
                            <span>Start</span>
                            <input type="datetime-local" id="time-start" step="3600">
                        </label>
                        <label>
                            <span>End</span>
                            <input type="datetime-local" id="time-end" step="3600">
                        </label>
                        <button class="btn btn-primary btn-sm" id="time-apply">Apply</button>
                        <button class="btn btn-secondary btn-sm" id="time-reset">Reset</button>
                    </div>
                    <div class="quick-time">
                        <button class="btn btn-ghost btn-sm" data-hours="1">Last Hour</button>
                        <button class="btn btn-ghost btn-sm" data-hours="6">Last 6h</button>
                        <button class="btn btn-ghost btn-sm" data-hours="24">Last 24h</button>
                        <button class="btn btn-ghost btn-sm" data-hours="168">Last Week</button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Event Types</h3>
                    <div class="event-type-filters" id="event-type-filters">
                        <!-- Populated dynamically from API -->
                    </div>
                    <button class="btn btn-secondary btn-sm" id="event-type-select-all">Select All</button>
                    <button class="btn btn-secondary btn-sm" id="event-type-clear-all">Clear All</button>
                </div>

                <div class="sidebar-section">
                    <h3>Filters</h3>
                    <label>
                        <span>Min Confidence</span>
                        <input type="range" id="min-confidence" min="0" max="1" step="0.1" value="0">
                        <span id="confidence-value">0.0</span>
                    </label>
                    <label>
                        <span>Max Events</span>
                        <input type="number" id="max-events" min="100" max="10000" value="500" step="100">
                    </label>
                </div>

                <div class="sidebar-section">
                    <h3>Layers</h3>
                    <div id="layer-list">
                        <!-- Populated dynamically from API -->
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Stats</h3>
                    <div id="globe-stats">
                        <div class="stat-item">
                            <span class="stat-label">Total Events</span>
                            <span class="stat-value" id="stat-total">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Last 24h</span>
                            <span class="stat-value" id="stat-24h">0</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center: Globe View -->
            <main class="globe-main">
                <div class="globe-toolbar">
                    <div class="toolbar-group">
                        <button class="btn btn-secondary btn-sm" id="btn-reset-view" title="Reset View (R)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                <path d="M12 2v20M2 12h20"></path>
                            </svg>
                            Reset View
                        </button>
                        <button class="btn btn-secondary btn-sm" id="btn-fit-events" title="Fit All Events (F)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            </svg>
                            Fit Events
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-secondary btn-sm" id="btn-toggle-clustering" title="Toggle Clustering (C)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="4"></circle>
                                <line x1="12" y1="2" x2="12" y2="6"></line>
                                <line x1="12" y1="18" x2="12" y2="22"></line>
                                <line x1="2" y1="12" x2="6" y2="12"></line>
                                <line x1="18" y1="12" x2="22" y2="12"></line>
                            </svg>
                            Clustering
                        </button>
                        <button class="btn btn-secondary btn-sm" id="btn-toggle-timeline" title="Show Timeline (T)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                <line x1="8" y1="12" x2="16" y2="12"></line>
                            </svg>
                            Timeline
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <div class="event-count" id="event-count">0 events loaded</div>
                    </div>
                </div>

                <div id="cesium-container" class="cesium-container"></div>

                <!-- Event Detail Panel (slide-in) -->
                <div class="event-detail-panel" id="event-detail-panel">
                    <div class="panel-header">
                        <h3 id="panel-title">Event Details</h3>
                        <button class="btn btn-ghost btn-sm" id="panel-close">&times;</button>
                    </div>
                    <div class="panel-content" id="panel-content">
                        <p class="placeholder">Click an event on the globe to see details</p>
                    </div>
                </div>

                <!-- Timeline Panel (bottom slide-up) -->
                <div class="timeline-panel" id="timeline-panel">
                    <div class="timeline-header">
                        <h3>Event Timeline</h3>
                        <button class="btn btn-ghost btn-sm" id="timeline-close">&times;</button>
                    </div>
                    <div class="timeline-controls">
                        <input type="range" id="timeline-slider" min="0" max="100" value="0">
                        <div class="timeline-labels">
                            <span id="timeline-start"></span>
                            <span id="timeline-current"></span>
                            <span id="timeline-end"></span>
                        </div>
                        <div class="timeline-playback">
                            <button class="btn btn-secondary btn-sm" id="timeline-play" title="Play">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm" id="timeline-pause" title="Pause" style="display:none;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"></path></svg>
                            </button>
                            <select id="timeline-speed">
                                <option value="0.5">0.5x</option>
                                <option value="1" selected>1x</option>
                                <option value="2">2x</option>
                                <option value="5">5x</option>
                                <option value="10">10x</option>
                            </select>
                        </div>
                    </div>
                    <div class="timeline-chart" id="timeline-chart">
                        <canvas id="timeline-canvas"></canvas>
                    </div>
                </div>
            </main>

            <!-- Right Panel: Event List / Search -->
            <aside class="globe-sidebar globe-sidebar-right" id="globe-sidebar-right">
                <div class="sidebar-section">
                    <h3>Search Events</h3>
                    <input type="text" id="event-search" placeholder="Search by location, type, or entity..." class="search-input">
                    <div id="search-results" class="search-results"></div>
                </div>

                <div class="sidebar-section">
                    <h3>Recent Events <span id="recent-count">(0)</span></h3>
                    <div id="recent-events" class="event-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Top Locations</h3>
                    <div id="top-locations" class="location-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="/static/globe/globe-core.js"></script>
    <script src="/static/globe/globe-layers.js"></script>
    <script src="/static/globe/globe-timeline.js"></script>
    <script src="/static/globe/globe-interaction.js"></script>
    <script src="/static/globe/globe-init.js"></script>
</body>
</html>
